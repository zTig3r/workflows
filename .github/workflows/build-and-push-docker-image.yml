name: Docker Image CI

on:
  workflow_call:
    inputs:
      project_name:
        required: true
        type: string
    secrets:
      DEPLOYMENT_REPO_PAT:
        required: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
    - name: Checkout Main Repo
      uses: actions/checkout@v4

    - name: Checkout K8s Repo
      uses: actions/checkout@v4
      with:
        repository: 'zTig3r/k8s-deployments'
        path: 'k8s-deployments'
        token: ${{ secrets.DEPLOYMENT_REPO_PAT }}
    
    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build Docker image
      run: docker build . --file Dockerfile --tag ghcr.io/ztig3r/${{ inputs.project_name }}:latest
      
    - name: Push Docker image
      run: |
        docker push ghcr.io/ztig3r/${{ inputs.project_name }}:latest
