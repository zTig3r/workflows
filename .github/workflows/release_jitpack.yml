name: Release to JitPack

on:
  workflow_call:
    inputs:
      prebuild:
        description: "Trigger JitPack build automatically after tagging"
        required: false
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Extract version from gradle.properties
        id: version
        run: |
          VERSION=$(grep "^version=" gradle.properties | cut -d'=' -f2 | tr -d '[:space:]')
          if [ -z "$VERSION" ]; then
            echo "❌ version not found in gradle.properties"
            exit 1
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Detected version: $VERSION"

      - name: Build project
        run: ./gradlew clean build --stacktrace

      - name: Create Git tag and push
        run: |
          VERSION=${{ steps.version.outputs.version }}
          echo "Tagging version $VERSION"
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor }}@users.noreply.github.com"
          git tag -a "$VERSION" -m "Release $VERSION"
          git push origin "$VERSION"

      - name: Trigger JitPack build (optional)
        if: ${{ inputs.prebuild == true }}
        run: |
          REPO=${{ github.repository }}
          VERSION=v${{ steps.version.outputs.version }}
          echo "Triggering JitPack build for $REPO:$VERSION"
          curl -s "https://jitpack.io/api/builds/github/$REPO/$VERSION"
